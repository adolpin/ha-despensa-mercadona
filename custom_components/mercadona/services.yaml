add_product:
  fields:
    text:
      example: "leche"
      selector:
        text:
    ean:
      example: "8402001027482"
      selector:
        text:
    product_id:
      example: "4241"
      selector:
        text:
    qty:
      default: 1
      selector:
        number:
          min: 0.001
          max: 50
          step: 0.001
          mode: box
    mode:
      default: ensure
      selector:
        select:
          translation_key: mode
          options:
            - ensure
            - add
    source:
      default: ha
      example: scanner
      selector:
        text:
    learn_text:
      example: "leche"
      selector:
        text:

